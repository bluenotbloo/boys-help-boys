# user模块的专属proto生成配置
# 执行时去buf.yaml所在目录 执行 `buf generate --template user/buf.gen.yaml` 
# plugins.out 生成路径相对于 buf.yaml所在位置定义                  
version: v1
plugins:
  - plugin: go
    out: user/gen   
    opt: [paths=source_relative]
  - plugin: go-grpc
    out: user/gen
    opt: [paths=source_relative, require_unimplemented_servers=true]
  - plugin: grpc-gateway
    out: user/gen
    opt: [paths=source_relative, generate_unbound_methods=true]