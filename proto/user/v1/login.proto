// proto/user/v1/user.proto
syntax = "proto3";   // 指定 proto3 语法

// package 定义包名
package user.v1;

// go_package 定义包的导入路径  
// go_package会自动加上 package user.v1中定义的user/v1 
// 所以路径实际上github.com/bluenotbloo/boys-help-boys/proto+/user/v1
option go_package = "github.com/bluenotbloo/boys-help-boys/proto/user/gen/user/v1";

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  int64 user_id = 4;
}
