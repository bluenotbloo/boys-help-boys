syntax = "proto3";
package user.v1;

option go_package = "github.com/bluenotbloo/boys-help-boys/proto";

// 定义service时需引用
import "google/api/annotations.proto";

// 导入login接口对应的依赖模块,导入路径是相对于buf.yaml所在路径的
import "user/v1/login.proto";   

service UserService {
  // 认证相关
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = { post: "/api/v1/user/login"; body: "*" };
  }
}