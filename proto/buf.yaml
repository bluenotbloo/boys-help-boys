# proto/buf.yaml  buf 编译proto文件生成代码

# buf命令	                                     作用
# buf generate	                            生成代码（核心）
# buf lint	                                语法/风格检查
# buf format -w	                            格式化 .proto 文件
# buf breaking --against '.git#branch=main'	破坏性变更检测
# buf dep update	                          升级依赖版本
# buf build	                                仅编译检查，不生成代码

version: v1                    # 配置版本，固定 v1
name: github.com/bluenotbloo/boys-help-boys  # 可选：发布到 buf.build 时的仓库名

# ---------- 破坏性变更检测规则 ----------
breaking:
  use:                         # 启用的检测规则集
    - FILE                     # 文件级：检测文件增删、包名变更
    - PACKAGE                  # 包级：检测服务/消息/字段增删改
    - WIRE                     # 线路级：检测 wire 兼容性（字段号、类型）
    - WIRE_JSON                # JSON 线路兼容性

# ---------- 语法/风格检查规则 ----------
lint:
  use: [DEFAULT]               # 启用规则集

# ---------- 依赖管理 ----------
deps:                          # 外部依赖（自动从 buf.build 下载）
  - buf.build/googleapis/googleapis      # google/api/annotations.proto 等

