name: boys-help-boys

services:
  nacos:
    image: nacos/nacos-server:latest   # 使用最新版本的Nacos
    container_name: nacos
    environment:
      - MODE=standalone                  # 单机模式
      - PREFER_HOST_MODE=hostname        # 避免容器 IP 变化导致注册问题
      - NACOS_AUTH_ENABLE=false          # 可选：关闭鉴权（默认 false，开发环境方便）
      # 如果需要开启鉴权，请取消下面注释并设置密钥
      - NACOS_AUTH_ENABLE=false
      # 以下三个变量必须同时设置，即使关闭鉴权也需要提供（任意合法值即可）
      - NACOS_AUTH_TOKEN=VGhpc0lzTXlDdXN0b21TZWNyZXRLZXlGb3JOYWNvc0F1dGhUb2tlbiE=  #Nacos 用于生成JWT Token的密钥，使用长度大于32字符的字符串，再经过Base64编码。
      - NACOS_AUTH_IDENTITY_KEY=boyshelpboysIdentityKey #Nacos Server端之间 Inner API的身份标识的Key，必填。
      - NACOS_AUTH_IDENTITY_VALUE=boyshelpboysIdentityValue #Nacos Server端之间 Inner API的身份标识的Value，必填。
    ports:
      - "8080:8080"   # Nacos Server端口（默认8080）
      - "8848:8848"   # 控制台 + HTTP API
      - "9848:9848"   # gRPC 通信端口（Nacos 2.x 客户端需要）
      - "9849:9849"   # 服务发现端口（Nacos 2.x 客户端需要）
    volumes:
      - nacos_data:/home/nacos/data     # 持久化数据（配置、服务注册信息等）
    restart: unless-stopped  # 除非-stopped  # 在容器退出时自动重启
    networks:
      - boys-help-boys-network   # 使用自定义网络，便于服务间通信

  postgres:
    image: postgres:16-alpine   # 使用轻量级的PostgreSQL 15版本
    container_name: postgres
    environment:
      - POSTGRES_USER=root   # 数据库用户名
      - POSTGRES_PASSWORD=123456   # 数据库密码
      - POSTGRES_DB=boys-help-boys   # 数据库名
    ports:
      - "127.0.0.1:5432:5432"   # PostgreSQL端口（默认5432）
    volumes:
      - postgres_data:/var/lib/postgresql/data   # 持久化数据
    restart: unless-stopped  # 除非-stopped  # 在容器退出时自动重启
    networks:
      - boys-help-boys-network   # 使用自定义网络，便于服务间通信

  gateway:
    build:
      context: .   # 构建上下文为当前根目录
      dockerfile: gateway/dockerfile  # 指定 Dockerfile 文件路径
    container_name: gateway
    env_file:
      - ./gateway/.env
    environment:
      - NACOS_ADDR=nacos   # 指向 Nacos 服务的容器名称，替换env中写死的host
      - NACOS_PORT=8848   
    ports:
      - "127.0.0.1:8081:8081"   # 网关服务端口（默认8081）
    depends_on:
      - nacos
    restart: unless-stopped  # 除非-stopped  # 在容器退出时自动重启
    networks:
      - boys-help-boys-network   # 使用自定义网络，便于服务间通信


networks:
  boys-help-boys-network:
    driver: bridge   # 桥接网络驱动
volumes:
  nacos_data:
    driver: local   # 本地存储驱动
  postgres_data:
    driver: local