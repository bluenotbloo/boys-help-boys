gateway:
  host: "127.0.0.1"  # 仅本地调试使用， 镜像部署暴露 0.0.0.0:8081
  port: 8081

logger:
  level: "info"
  encoding: "json"
  filename: "log/gateway.log"
  max-size: 100
  max-backups: 3
  max-age: 7
  compress: true
  console: true

jwt:
  secret: "boys-help-boys"  # HS256 secret, 生产环境建议用 RS256 公钥
  issuer: "boys-help-boys"
  expires_in: "24h"

upstream:
  user_service: "127.0.0.1:8082"  # user 服务的 grpc-gateway HTTP 地址，后续可改为 Nacos 动态发现